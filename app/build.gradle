plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.iconbrowser'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.iconbrowser"
        minSdk 24
        targetSdk 34
        // A higher versionCode on every CI build lets Android treat each new
        // APK as an update to install over the previous one instead of a
        // conflicting package. Locally (no CI env var) it just falls back to 1.
        versionCode (System.getenv("GITHUB_RUN_NUMBER") as Integer ?: 1)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        debug {
            // A fixed, repo-committed debug keystore (instead of the
            // machine-specific one Android Studio/CI auto-generates) so every
            // build — local or on GitHub Actions — signs with the SAME key.
            // That's what lets you install a new build over an old one
            // without uninstalling first.
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
